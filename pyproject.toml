[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivesafe"
version = "0.1.0"
description = "In cabin driver monitoring for real time drowsiness and distraction detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2.5",
    "opencv-python>=4.9",
    "mediapipe>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
